import java.util.Properties

plugins {
    id 'com.android.application'
}

// 签名信息放在 android/keystore.properties（不进仓库）。没有这个文件时只出 debug 包。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'dev.dropsluice.app'
    compileSdk 34

    defaultConfig {
        applicationId "dev.dropsluice.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.0.6"
        // 电脑面板靠这段 UA 认出「这是官方 App」而不是随便一个浏览器
        buildConfigField "String", "UA_TAG", "\"DropSluice/1.0\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

// CameraX 会把老版本 kotlin-stdlib-jdk7/jdk8(1.6.21) 拖进来，和 kotlin-stdlib 1.8.22 里
// 已经合并进去的同名类撞车（Duplicate class ...）。1.8 起 jdk7/jdk8 的类都并进了 stdlib，
// 所以这里把两个旧模块排掉、版本钉在 1.8.22。
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because '和 CameraX 自带的 stdlib 对齐，避免 Duplicate class'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    // 纯 Java 的二维码解码器（zxing core），不依赖 Google Play 服务
    implementation 'com.google.zxing:core:3.5.3'
}
