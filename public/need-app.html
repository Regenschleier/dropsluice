<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>DropSluice · 请用 App 打开</title>
<link rel="stylesheet" href="/style.css">
<style>
  .need-app h1 { margin: 0 0 8px; font-size: 22px; }
  .need-app .lead { color: var(--fg-dim); margin: 0 0 18px; }
  .need-app .steps { margin: 0; padding-left: 20px; }
  .need-app .steps li { margin: 10px 0; }
  .need-app .dl { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .need-app .dl a {
    display: block; text-align: center; padding: 13px 16px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  .need-app .dl .note { color: var(--fg-dim); font-size: 13px; text-align: center; }
  .need-app code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body class="need-app">
<main class="pair">
  <h1>请用 DropSluice App 打开</h1>
  <p class="lead">手机上不提供网页版：浏览、下载、上传都在 App 里做，网页只在电脑上用来配对。</p>

  <section class="card">
    <ol class="steps">
      <li>装好 DropSluice App（下面有安装包）。</li>
      <li>打开 App，点「扫码」。</li>
      <li>对着电脑屏幕上那个二维码扫一下，就连上了。</li>
    </ol>

    <div class="dl" id="dl">
      <a id="apkBtn" href="/apk">下载安装包（.apk）</a>
      <div class="note" id="apkNote">正在检查这台电脑上有没有安装包…</div>
    </div>
  </section>

  <p class="muted small">
    已经装了 App？直接打开它，用 App 自己的扫码功能扫电脑上的码 —— 摄像头扫出来的链接会落到这个页面，那是因为它被当成浏览器打开了。
  </p>
</main>
<script>
  // 电脑旁边有安装包就显示下载按钮，没有就说清楚去哪儿拿，别让人点出一个 JSON 报错。
  (async () => {
    const note = document.getElementById('apkNote');
    const btn = document.getElementById('apkBtn');
    try {
      const r = await fetch('/apk', { method: 'HEAD' });
      if (!r.ok) throw new Error('missing');
      const size = Number(r.headers.get('content-length') || 0);
      note.textContent = `安装包就在这台电脑上（${(size / 1024 / 1024).toFixed(1)} MB），点上面按钮直接下。`;
    } catch {
      btn.style.display = 'none';
      note.textContent = '这台电脑旁边没放安装包：去 GitHub 的 Release 页面下载 DropSluice-<版本>.apk，或者从电脑上把它拷过来。';
    }
  })();
</script>
</body>
</html>
