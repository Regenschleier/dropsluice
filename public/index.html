<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>DropSluice · 电脑文件</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <button id="home" class="icon" title="回到盘符" aria-label="回到盘符"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></button>
  <div id="crumbs" class="crumbs"></div>
  <button id="refresh" class="icon" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.6 5.9M20 5v6h-6"/></svg></button>
  <a id="downloads" class="icon" href="/downloads" title="下载记录" aria-label="下载记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"/></svg></a>
</header>

<main>
  <div id="roots" class="roots hidden"></div>
  <div id="filterWrap" class="filter hidden">
    <input id="filter" type="search" placeholder="在当前文件夹里筛选…" autocomplete="off">
  </div>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty hidden"></div>
  <div id="status" class="status hidden"></div>
</main>

<footer class="bar bottom">
  <button id="zipBtn" class="ghost">打包下载本文件夹</button>
  <label class="ghost" for="uploadInput">传文件上来</label>
  <input id="uploadInput" type="file" multiple hidden>
  <button id="unpair" class="ghost danger">解除配对</button>
</footer>

<div id="xfer" class="xfer hidden"></div>
<div id="selBar" class="xfer selbar hidden">
  <span id="selCount" class="selcount">已选 0 项</span>
  <button id="selDownload" class="primary">下载所选</button>
  <button id="selCancel" class="ghost">取消</button>
</div>

<script src="/app.js"></script>
</body>
</html>
